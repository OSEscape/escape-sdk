  WIDGET_PROP_CONTENT_TYPE = 7;
  WIDGET_PROP_DRAG_DEAD_TIME = 8;
  WIDGET_PROP_DRAG_DEAD_ZONE = 9;
  WIDGET_PROP_DRAG_PARENT = 10;
  WIDGET_PROP_FONT = 11;
  WIDGET_PROP_FONT_ID = 12;
  WIDGET_PROP_HEIGHT = 13;
  WIDGET_PROP_HEIGHT_MODE = 14;
  WIDGET_PROP_ID = 15;
  WIDGET_PROP_INDEX = 16;
  WIDGET_PROP_ITEM_ID = 17;
  WIDGET_PROP_ITEM_QUANTITY = 18;
  WIDGET_PROP_ITEM_QUANTITY_MODE = 19;
  WIDGET_PROP_LINE_HEIGHT = 20;
