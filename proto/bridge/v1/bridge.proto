syntax = "proto3";
package bridge.v1;

import "google/protobuf/empty.proto";

option java_package = "bridge.proto.v1";
option java_multiple_files = true;

service BridgeService {
  rpc GetWidgetProperties(GetWidgetRequest) returns (GetWidgetResponse);
  rpc GetWidgetPropertiesBatch(GetWidgetBatchedRequest) returns (GetWidgetArrayResponse);
  rpc GetWidgetChild(GetWidgetChildRequest) returns (GetWidgetResponse);
  rpc GetWidgetChildren(GetWidgetRequest) returns (GetWidgetArrayResponse);
  rpc GetWidgetChildrenMasked(GetWidgetChildrenMaskedRequest) returns (GetWidgetArrayResponse);
  rpc GetWidgetChildrenBatch(GetWidgetBatchedRequest) returns (GetWidgetArrayResponse);
  rpc GetItemContainer(GetItemContainerRequest) returns (GetItemContainerResponse);

  // Clickbox tracking
  rpc StartClickboxTracking(StartClickboxTrackingRequest) returns (google.protobuf.Empty);
  rpc StopClickboxTracking(google.protobuf.Empty) returns (google.protobuf.Empty);

  // Drawing overlay
  rpc AddBox(AddBoxRequest) returns (google.protobuf.Empty);
  rpc AddCircle(AddCircleRequest) returns (google.protobuf.Empty);
  rpc AddLine(AddLineRequest) returns (google.protobuf.Empty);
  rpc AddPolygon(AddPolygonRequest) returns (google.protobuf.Empty);
  rpc AddText(AddTextRequest) returns (google.protobuf.Empty);
  rpc AddImage(AddImageRequest) returns (google.protobuf.Empty);
  rpc ClearDrawing(google.protobuf.Empty) returns (google.protobuf.Empty);
  rpc ClearDrawingTag(ClearDrawingTagRequest) returns (google.protobuf.Empty);
  rpc BatchDraw(BatchDrawRequest) returns (google.protobuf.Empty);

  // Entity streaming - subscribe-as-you-go
  rpc StreamNpcs(StreamNpcsRequest) returns (NpcUpdate);
  rpc StreamObjects(StreamObjectsRequest) returns (SceneObjectsUpdate);
  rpc StreamGroundItems(google.protobuf.Empty) returns (GroundItemsUpdate);

  // One-time snapshots (no streaming subscription)
  rpc GetAllNpcs(google.protobuf.Empty) returns (NpcUpdate);
  rpc GetAllObjects(google.protobuf.Empty) returns (SceneObjectsUpdate);
  rpc GetAllGroundItems(google.protobuf.Empty) returns (GroundItemsUpdate);

  // Login
  rpc SetCredentials(SetCredentialsRequest) returns (google.protobuf.Empty);
  rpc GetLoginIndex(google.protobuf.Empty) returns (GetLoginIndexResponse);

  // Client scripts
  rpc RunScript(RunScriptRequest) returns (RunScriptResponse);

  // Streaming - server pushes updates, client sends subscribe/ack
  rpc Subscribe(stream ClientMessage) returns (stream ServerMessage);
}

// =============================================================================
// Streaming API
// =============================================================================

// Client -> Server messages
message ClientMessage {
  oneof message {
    Subscribe subscribe = 1;
  }
}

// Subscribe to updates
message Subscribe {
  SubscriptionOptions options = 1;
}

message SubscriptionOptions {
  bool enable_all = 1;
}

// Server -> Client messages
message ServerMessage {
  oneof message {
    VarpSnapshot snapshot = 1;     // Initial full state on subscribe
    ChatSnapshot chat_snapshot = 2; // Initial chat state on subscribe
    StatsSnapshot stat_snapshot = 3; // Initial stats state on subscribe
    VarcIntSnapshot varc_int_snapshot = 4; // Initial varc int state on subscribe
    VarcStrSnapshot varc_str_snapshot = 5; // Initial varc str state
    InterfaceSnapshot interface_snapshot = 6; // Initial active interfaces state on subscribe
    VarbitChanged varbit_changed = 7; // Varbit change notification
    ChatChanged chat_changed = 8;   // New chat message
    StatChanged stat_changed = 9;   // Stat change notification
    VarcIntChanged varc_int_changed = 10; // Varc int change notification
    VarcStrChanged varc_str_changed = 11; // Varc str change notification
    AnimationChanged animation_changed = 12; // Player animation change
    ItemContainerChanged item_container_changed = 13; // Item container change
    GameTickUpdate game_tick_update = 14; // Pushed every game tick (600ms)
    PostMenuSortUpdate post_menu_sort_update = 15; // Post menu sort notification
    MenuOptionClickUpdate menu_option_click_update = 16; // Menu option click notification
    GameStateChange game_state_change = 17; // Game state change notification
    WorldViewLoad world_view_load = 18; // World view load notification
    GroundItemsUpdate ground_items_update = 19; // Current ground items state
    MenuOpenUpdate menu_open_update = 20; // Current menu information when open
    SelectedWidgetUpdate selected_widget_update = 21; // Currently selected widget information
    ActiveInterfacesUpdate active_interfaces_update = 22; // Currently active interface information
    WorldEntityUpdate world_entity_update = 23;
    CameraChanged camera_changed = 24;
    SceneObjectsUpdate scene_objects_update = 25;
    Error error = 26;                // Error notification
    WarmupComplete warmup_complete = 27;  // Sent after all initial snapshots
    ClickboxUpdate clickbox_update = 28;  // Clickbox tracking update
    NpcUpdate npc_update = 29;  // NPC streaming update
    CollisionUpdate collision_update = 30;  // Collision flag patches (door open/close)
  }
}

message CollisionUpdate {
  repeated int32 indices = 1;  // Flat offsets into [planes][x][y] array
  repeated int32 flags = 2;    // New flag value at each index
}

message Varp {
  int32 varp_id = 1;
  int32 varbit_id = 2;  // -1 if not a varbit
  int32 value = 3;
}

message VarpSnapshot {
  repeated Varp varps = 1;
}

message VarbitChanged {
  Varp varbit_changed = 1;
}

message ChatSnapshot {
  repeated ChatMessage messages = 1;
}

message ChatMessage {
  string type = 1;
  string sender = 2;
  string message = 3;
}

message ChatChanged {
  ChatMessage message = 1;
}

message Stat {
  string skill = 1;
  int32 xp = 2;
  int32 level = 3;
  int32 boosted_level = 4;
}

message StatsSnapshot {
  repeated Stat stats = 1;
}

message StatChanged {
  Stat stat = 1;
}

message VarcInt {
  int32 varc_id = 1;
  int32 value = 2;
}

message VarcIntSnapshot {
  repeated VarcInt varcs = 1;
}

message VarcIntChanged {
  VarcInt varc_int_changed = 1;
}

message VarcStr {
  int32 varc_id = 1;
  string value = 2;
}

message VarcStrSnapshot {
  repeated VarcStr varcs = 1;
}

message VarcStrChanged {
  VarcStr varc_str_changed = 1;
}

message AnimationChanged {
  string actor_name = 1;
  int32 animation_id = 2;
  int32 location = 3; //Packed coord
}

message InterfaceSnapshot {
  repeated int32 active_interfaces = 1;
}

message ActiveInterfacesUpdate {
  repeated int32 active_interfaces = 1;
}

message Item{
  int32 id = 1;
  string name = 2;
  int32 quantity = 3;
  bool noted = 4;
  int32 slot = 5;
}

message ItemContainerChanged {
  int32 container_id = 1;
  bool is_special = 2; // equipment, bank, inventory
  repeated Item items = 3;
}

message GameTickUpdate {
  int32 tick = 1;
  int32 energy = 2;
  int32 scene_x = 3;
  int32 scene_y = 4;
  int32 target_x = 5;
  int32 target_y = 6;
  int32 interacting_index = 7; // -1 = none, >= 0 = NPC array index
  int32 canvas_offset_x = 8;
  int32 canvas_offset_y = 9;
  int32 plane = 10;
}

message MenuOpenUpdate {
  bool menu_open = 1;
  int32 menu_x = 2;
  int32 menu_y = 3;
  int32 menu_width = 4;
  int32 menu_height = 5;
  bool scrollable = 6;
  bool has_sub_menu = 7;
  int32 sub_menu_x = 8;
  int32 sub_menu_y = 9;
  int32 sub_menu_width = 10;
  int32 sub_menu_height = 11;
}

message SelectedWidgetUpdate {
  int32 selected_widget_id = 1;
  int32 index = 2;
}

message CameraChanged {
  int32 camera_x = 1;
  int32 camera_y = 2;
  int32 camera_z = 3;
  double pitch = 4;
  double yaw = 5;
  int32 scale = 6;
}

message GroundItem {
  int32 id = 1;
  int32 quantity = 2;
  string name = 3;
  int32 packed_location = 4;
  int32 ownership = 5; 
}

message GroundItemsUpdate {
  repeated GroundItem ground_items = 1;
}

message WorldEntityUpdate {
  int32 entity_x = 1;
  int32 entity_y = 2;
  int32 orientation = 3;
  int32 ground_height_offset = 4;
}

message SubMenu {
  int32 parent_index = 1;
  repeated string options = 2;
  repeated string targets = 3;
  repeated string menu_actions = 4;
}

message PostMenuSortUpdate {
  repeated string options = 1;
  repeated string targets = 2;
  repeated string menu_actions = 3;
  repeated SubMenu sub_menus = 4;
}

message GameObject {
  int32 type = 1;
  int32 id = 2;
  int32 packed_location = 3;
  int32 orientation = 4;
  int32 size_x = 5;
  int32 size_y = 6;
  string name = 7;
  repeated string actions = 8;
}

message SceneObjectsUpdate {
  repeated GameObject objects = 1;
}

message WorldViewLoad {
  int32 plane = 1;
  int32 base_x = 2;
  int32 base_y = 3;
  int32 size_x = 4;
  int32 size_y = 5;
  repeated int32 tile_heights = 6;
  repeated bool bridge_flags = 7;
  int32 bounds_x = 8;
  int32 bounds_y = 9;
  int32 bounds_width = 10;
  int32 bounds_height = 11;
  repeated int32 collision_flags = 12;          // Flattened [planes][x][y], raw CollisionData flags
  repeated int32 instance_template_chunks = 13; // Flattened [planes][chunks_x][chunks_y], only when is_instance
  bool is_instance = 14;
}

message GameStateChange {
  string state = 1;
}

message MenuOptionClickUpdate {
  string menu_option = 1;
  string menu_target = 2;
  int32 id = 3;
  int32 widget_id = 4;
  int32 param0 = 5;
  int32 param1 = 6;
  string menu_action = 7;
  int32 click_location = 8; //Packed coord
}

