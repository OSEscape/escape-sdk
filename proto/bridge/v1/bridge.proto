  WIDGET_PROP_ON_LOAD = 29;
  WIDGET_PROP_ON_OP = 30;
  WIDGET_PROP_ON_VAR_TRANSMIT = 31;
  WIDGET_PROP_OPACITY = 32;
  WIDGET_PROP_ORIGINAL_HEIGHT = 33;
  WIDGET_PROP_ORIGINAL_WIDTH = 34;
  WIDGET_PROP_ORIGINAL_X = 35;
  WIDGET_PROP_ORIGINAL_Y = 36;
  WIDGET_PROP_PARENT = 37;
