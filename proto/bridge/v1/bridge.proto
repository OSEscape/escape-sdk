message Rectangle {
  int32 x = 1;
  int32 y = 2;
  int32 width = 3;
  int32 height = 4;
}

message Point {
  int32 x = 1;
  int32 y = 2;
}

message Polygon {
  repeated Point points = 1;
}

message DataValue {                                                                                                                                                                               
  oneof value {                                                                                                                                                                                   
    int32 i32 = 1;                                                                                                                                                                                
    int64 i64 = 2;                                                                                                                                                                                
    string str = 3;                                                                                                                                                                               
    bool b = 4;                                                                                                                                                                                   
    Rectangle rectangle = 5;
    Point point = 6;                                                                                                                                                               
  }                                                                                                                                                                                               
} 

message DataValueList {                                                                                                                                                                           
  repeated DataValue values = 1;                                                                                                                                                                  
}                                                                                                                                                                                                 
                                                                                                                                                                                                  
message WidgetValue {                                                                                                                                                                             
  oneof value {                                                                                                                                                                                   
    DataValue single_value = 1;                                                                                                                                                                   
    DataValueList multiple_values = 2;                                                                                                                                                            
  }                                                                                                                                                                                               
}  

message WidgetResponse{
  map<string, WidgetValue> values = 1;
}

message GetWidgetRequest {
  int32 widget_id = 1;
  uint64 mask = 2;
}

message GetWidgetBatchedRequest {
  repeated int32 widget_ids = 1;
  repeated uint64 mask = 2;
}

message GetWidgetChildRequest {
  int32 widget_id = 1;
  int32 child_index = 2;
  uint64 mask = 3;
}

message GetWidgetChildrenMaskedRequest {
  int32 widget_id = 1;
  repeated int32 child_mask = 2;
  uint64 mask = 3;
}

message GetWidgetResponse {
  WidgetResponse widget = 1;
}

message GetWidgetArrayResponse {
  repeated WidgetResponse widget_array = 1;
}

message GetItemContainerRequest {
  int32 container_id = 1;
}

message GetItemContainerResponse {
  repeated Item items = 1;
}

message Error {
  string message = 1;
  int32 code = 2;
}

message WarmupComplete {
  // Signals that all initial snapshots have been sent
  // Client should wait for this before considering warmup complete
}

// =============================================================================
// Clickbox Tracking
// =============================================================================

message StartClickboxTrackingRequest {
  oneof target {
    GroundItemTarget ground_item = 1;
    NpcTarget npc = 2;
    ObjectTarget object = 3;
    TileTarget tile = 4;
  }
  optional bool debug = 5;
}

message GroundItemTarget {
  int32 packed_location = 1;  // World coordinate (packed)
  int32 item_id = 2;           // To disambiguate item stacks
}

message NpcTarget {
  int32 npc_index = 1;  // Index in client.getNpcs() array (NOT npc_id)
}

message ObjectTarget {
  int32 packed_location = 1;  // World coordinate (packed)
  int32 object_id = 2;         // To match specific object
}

message TileTarget {
  int32 packed_location = 1;  // World coordinate (packed)
}

message ClickboxUpdate {
  bool target_exists = 1;           // False when target disappears
  repeated int32 vertices = 2;      // Flat array: [x0,y0, x1,y1, x2,y2, ...]
}

// =============================================================================
// Drawing Overlay
// =============================================================================

message AddBoxRequest {
  int32 x = 1;
  int32 y = 2;
  int32 width = 3;
  int32 height = 4;
  int32 argb_color = 5;
  bool filled = 6;
  string tag = 7;
}

message AddCircleRequest {
  int32 x = 1;
  int32 y = 2;
  int32 radius = 3;
  int32 argb_color = 4;
  bool filled = 5;
  string tag = 6;
}

message AddLineRequest {
  int32 x1 = 1;
  int32 y1 = 2;
  int32 x2 = 3;
  int32 y2 = 4;
  int32 argb_color = 5;
  int32 thickness = 6;
  string tag = 7;
}

message AddPolygonRequest {
  repeated int32 x_points = 1;
  repeated int32 y_points = 2;
  int32 argb_color = 3;
  bool filled = 4;
  string tag = 5;
}

message AddTextRequest {
  string text = 1;
  int32 x = 2;
  int32 y = 3;
  int32 argb_color = 4;
  int32 font_size = 5;
  string tag = 6;
}

message AddImageRequest {
  repeated int32 argb_pixels = 1;
  int32 img_width = 2;
  int32 img_height = 3;
  int32 x = 4;
  int32 y = 5;
  string tag = 6;
}

message ClearDrawingTagRequest {
  string tag = 1;
}

message DrawCommand {
  oneof command {
    AddBoxRequest box = 1;
    AddCircleRequest circle = 2;
    AddLineRequest line = 3;
    AddPolygonRequest polygon = 4;
    AddTextRequest text = 5;
    AddImageRequest image = 6;
  }
}

message BatchDrawRequest {
  repeated DrawCommand commands = 1;
  string clear_tag = 2;
}

// =============================================================================
// NPC Streaming
// =============================================================================

message NpcData {
  int32 index = 1;
  int32 id = 2;
  string name = 3;
  repeated int32 overhead_sprite_ids = 4;
  repeated int32 overhead_archive_ids = 5;
  int32 world_x = 6;
  int32 world_y = 7;
  int32 plane = 8;
  int32 animation = 9;
  int32 pose_animation = 10;
  int32 orientation = 11;
  int32 combat_level = 12;
  bool is_dead = 13;
  int32 health_ratio = 14;
  int32 health_scale = 15;
  int32 interacting_index = 16;
  string overhead_text = 17;
  repeated string actions = 18;
  int32 size = 19;
  repeated int32 spot_anim_ids = 20;
}

message NpcUpdate {
  repeated NpcData npcs = 1;
}

// =============================================================================
// Entity Streaming Requests
// =============================================================================

message StreamNpcsRequest {
  repeated int32 ids = 1;
  repeated string names = 2;
  bool stream_all = 3;
}

message StreamObjectsRequest {
  repeated int32 ids = 1;
  repeated string names = 2;
  bool stream_all = 3;
}

// =============================================================================
// Login
// =============================================================================

message SetCredentialsRequest {
  string username = 1;
  string password = 2;
}

message GetLoginIndexResponse {
  int32 login_index = 1;
}

// =============================================================================
// Client Scripts (CS2)
// =============================================================================

message ScriptArg {
  oneof value {
    int32 int_value = 1;
    string string_value = 2;
  }
}

message RunScriptRequest {
  int32 script_id = 1;
  repeated ScriptArg args = 2;
  int32 int_result_count = 3;    // How many ints to read from stack after execution
  int32 string_result_count = 4; // How many strings to read from stack after execution
}

message RunScriptResponse {
  repeated int32 int_results = 1;
  repeated string string_results = 2;
}
